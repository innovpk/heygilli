[project]
name = "heygilli-agents"
version = "0.1.0"
description = "HeyGilli agent service: Strands agents (Curator, Planner, Buddy, Digest) behind a FastAPI gateway."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "strands-agents[anthropic]>=1.0",
  "strands-agents-tools>=0.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",     # POST /import/takeout is a multipart upload
  "pydantic>=2.7",
  "boto3>=1.35",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "requests>=2.31",
  "youtube-transcript-api>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "websockets>=12"]
# Optional providers, each one env-var swap away (README "Provider swap").
ollama = ["strands-agents[ollama]>=1.0"]
openai = ["strands-agents[openai]>=1.0"]
# Only the get_transcript tool uses Gemini (YouTube URL -> transcript, SPEC 9.4).
gemini = ["google-genai>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["heygilli_agents"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
