[project]
name = "heygilli-agents"
version = "0.1.0"
description = "HeyGilli agent service: Strands agents (Curator, Planner, Buddy, Digest) behind a FastAPI gateway."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "strands-agents[anthropic]>=1.0",
  "strands-agents-tools>=0.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "boto3>=1.35",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["heygilli_agents"]

[tool.ruff]
line-length = 100
