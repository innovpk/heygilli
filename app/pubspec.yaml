name: heygilli
description: "HeyGilli: an AI co-watching buddy for kids YouTube."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.5.1
  flutter_svg: ^2.0.17
  flutter_tts: ^4.2.5
  google_fonts: ^6.3.3
  http: ^1.6.0
  provider: ^6.1.5
  shared_preferences: ^2.5.5
  speech_to_text: ^7.4.0
  web_socket_channel: ^3.0.3
  youtube_player_iframe: ^6.0.2
  google_sign_in: ^7.2.0
  # Named directly for the authorization-code flow's request types, which the
  # high-level google_sign_in API does not expose. Platform-neutral Dart, so no
  # conditional import is needed.
  google_sign_in_platform_interface: ^3.1.0
  file_picker: ^12.2.0
  archive: ^4.2.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/gilli.svg
    - assets/gilli/
    - assets/icons/
    - assets/icons.json
