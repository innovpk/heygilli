<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="HeyGilli: an AI co-watching buddy for kids' YouTube. A parent decides everything; Gilli only ever asks.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="HeyGilli">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=2">

  <!-- Favicon -->
  <!-- ?v= is not decoration: a browser that cached the Flutter
       default keeps it through an ordinary reload. Bump it
       whenever the icon changes. -->
  <link rel="icon" type="image/png" href="favicon.png?v=2"/>

  <title>HeyGilli</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Evict a service worker installed by an earlier build.
    //
    // Turning registration off in the build stops new ones being created but
    // does nothing about the ones already out there: a browser that installed
    // one keeps serving that build's cached bundle, and the person looking at
    // it sees an old app with no sign that is what it is. Nothing here works
    // offline anyway, so there is nothing to lose by clearing it.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        for (var i = 0; i < regs.length; i++) regs[i].unregister();
      }).catch(function () {});
      if (window.caches && caches.keys) {
        caches.keys().then(function (keys) {
          for (var i = 0; i < keys.length; i++) caches.delete(keys[i]);
        }).catch(function () {});
      }
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
