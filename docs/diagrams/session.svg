<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" font-family="Helvetica, Arial, sans-serif">
  <!-- One question, live. Message names from docs/PROTOCOL.md, WebSocket /sessions/{id}/ws. -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1E3A34"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B8452A"/>
    </marker>
    <style>
      .h1 { font-size: 30px; font-weight: 700; fill: #1E3A34; }
      .sub { font-size: 15px; fill: #607974; }
      .hd { font-size: 17px; font-weight: 700; fill: #1E3A34; }
      .hs { font-size: 12.5px; fill: #607974; }
      .m { font-size: 13.5px; fill: #1E3A34; }
      .mc { font-size: 13.5px; font-weight: 700; fill: #1E3A34; font-family: Menlo, Consolas, monospace; }
      .mr { font-size: 13.5px; fill: #B8452A; }
      .note { font-size: 12.5px; fill: #3F5A55; }
      .t { font-size: 13.5px; fill: #1E3A34; }
      .tb { font-size: 13.5px; font-weight: 700; fill: #1E3A34; }
      .head { fill: #DCEEEA; stroke: #1E3A34; stroke-width: 1.5; }
      .agent { fill: #FBE8E1; stroke: #B8452A; stroke-width: 1.5; }
      .life { stroke: #7D948F; stroke-width: 1.4; stroke-dasharray: 5 5; }
      .line { stroke: #1E3A34; stroke-width: 1.7; fill: none; }
      .rline { stroke: #B8452A; stroke-width: 1.7; fill: none; }
      .nb { fill: #FFFFFF; stroke: #D4DDDB; stroke-width: 1.2; }
      .band { fill: #F0A48C; opacity: 0.18; }
    </style>
  </defs>
  <rect width="1500" height="1000" fill="#F4FAF8"/>

  <text x="40" y="54" class="h1">One question, live</text>
  <text x="40" y="82" class="sub">A child watching, one WebSocket per session. The server decides when to ask; the app never does. Messages are the real ones from docs/PROTOCOL.md.</text>

  <!-- Heads -->
  <rect x="80" y="104" width="200" height="60" rx="12" class="head"/>
  <text x="180" y="130" class="hd" text-anchor="middle">Child</text>
  <text x="180" y="150" class="hs" text-anchor="middle">aged 5 to 12</text>

  <rect x="420" y="104" width="220" height="60" rx="12" class="head"/>
  <text x="530" y="130" class="hd" text-anchor="middle">Kid mode</text>
  <text x="530" y="150" class="hs" text-anchor="middle">Flutter, YouTube embed</text>

  <rect x="790" y="104" width="240" height="60" rx="12" class="head"/>
  <text x="910" y="130" class="hd" text-anchor="middle">Gateway session loop</text>
  <text x="910" y="150" class="hs" text-anchor="middle">FastAPI, /sessions/{id}/ws</text>

  <rect x="1170" y="104" width="260" height="60" rx="12" class="agent"/>
  <text x="1300" y="130" class="hd" text-anchor="middle">Buddy agent + Polly</text>
  <text x="1300" y="150" class="hs" text-anchor="middle">Strands, warm all session</text>

  <path d="M 180 164 L 180 850" class="life"/>
  <path d="M 530 164 L 530 850" class="life"/>
  <path d="M 910 164 L 910 850" class="life"/>
  <path d="M 1300 164 L 1300 850" class="life"/>

  <!-- the question band -->
  <rect x="60" y="318" width="1390" height="430" rx="10" class="band"/>
  <text x="70" y="338" class="note">one question, at a natural break</text>

  <!-- 1 hello / ready -->
  <path d="M 530 200 L 906 200" class="line" marker-end="url(#a)"/>
  <text x="718" y="192" class="mc" text-anchor="middle">hello</text>
  <path d="M 910 236 L 534 236" class="line" marker-end="url(#a)"/>
  <text x="718" y="228" class="m" text-anchor="middle"><tspan class="mc">ready</tspan>  when the questions will come, drawn as dots on the timeline</text>

  <!-- 2 position -->
  <path d="M 530 282 L 906 282" class="line" marker-end="url(#a)"/>
  <text x="718" y="274" class="m" text-anchor="middle"><tspan class="mc">position</tspan>  every half second while the video plays</text>

  <!-- 3 pause -->
  <path d="M 910 368 L 534 368" class="line" marker-end="url(#a)"/>
  <text x="718" y="360" class="m" text-anchor="middle"><tspan class="mc">pause</tspan>  the planned second has come</text>

  <!-- 4 ask -->
  <path d="M 910 414 L 534 414" class="line" marker-end="url(#a)"/>
  <text x="718" y="406" class="m" text-anchor="middle"><tspan class="mc">ask</tspan>  the question, its voice line, pictures if any</text>
  <text x="718" y="432" class="note" text-anchor="middle">no written question for ages 5–6</text>

  <!-- 5 app to child -->
  <path d="M 530 470 L 184 470" class="line" marker-end="url(#a)"/>
  <text x="355" y="462" class="m" text-anchor="middle">Gilli asks aloud; three picture cards</text>

  <!-- 6 child to app -->
  <path d="M 180 516 L 526 516" class="line" marker-end="url(#a)"/>
  <text x="355" y="508" class="m" text-anchor="middle">a word, a tap, or nothing</text>
  <rect x="200" y="530" width="310" height="40" rx="8" class="nb"/>
  <text x="355" y="555" class="note" text-anchor="middle">speech becomes text on the device; no audio leaves it</text>

  <!-- 7 answer -->
  <path d="M 530 600 L 906 600" class="line" marker-end="url(#a)"/>
  <text x="718" y="592" class="m" text-anchor="middle"><tspan class="mc">answer</tspan>  the words, the card, or none</text>

  <!-- 8 buddy -->
  <path d="M 910 628 L 1296 628" class="rline" marker-end="url(#r)"/>
  <text x="1105" y="620" class="mr" text-anchor="middle">score it; write the reply</text>
  <path d="M 1300 662 L 914 662" class="rline" marker-end="url(#r)"/>
  <text x="1105" y="682" class="mr" text-anchor="middle">result, reply line, gesture, the word to say back</text>

  <!-- 9 reply -->
  <path d="M 910 712 L 534 712" class="line" marker-end="url(#a)"/>
  <text x="718" y="704" class="m" text-anchor="middle"><tspan class="mc">reply</tspan>  in Gilli's Polly voice</text>
  <path d="M 530 730 L 184 730" class="line" marker-end="url(#a)"/>
  <text x="355" y="722" class="m" text-anchor="middle">Gilli says the word back, whatever they said</text>

  <!-- 10 resume -->
  <path d="M 910 780 L 534 780" class="line" marker-end="url(#a)"/>
  <text x="718" y="772" class="m" text-anchor="middle"><tspan class="mc">resume</tspan>  the video carries on</text>
  <path d="M 530 820 L 906 820" class="line" marker-end="url(#a)"/>
  <text x="718" y="812" class="mc" text-anchor="middle">resumed</text>

  <!-- Footnotes -->
  <rect x="40" y="866" width="1420" height="110" rx="12" class="nb"/>
  <text x="58" y="894" class="tb">When it does not go to plan</text>
  <text x="58" y="918" class="t">Silence is an answer: after the listening window, the server treats it as none and Gilli still says the word. After two silent turns a</text>
  <text x="58" y="938" class="t">5-year-old's remaining questions switch to pictures. A child who missed the question can ask to hear it again, once. When the day's</text>
  <text x="58" y="958" class="t">minutes run out, a break arrives instead of the next question, with the activity the parent chose, and the session ends.</text>
</svg>
