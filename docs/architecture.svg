<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240" font-family="Helvetica, Arial, sans-serif">
  <!-- HeyGilli, end to end. Hand-authored; matches what is deployed (11 Sep 2026). -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1E3A34"/>
    </marker>
    <style>
      .h1 { font-size: 30px; font-weight: 700; fill: #1E3A34; }
      .sub { font-size: 15px; fill: #607974; }
      .ph { font-size: 18px; font-weight: 700; fill: #1E3A34; }
      .ps { font-size: 13px; fill: #607974; }
      .bt { font-size: 15px; font-weight: 700; fill: #1E3A34; }
      .t { font-size: 13px; fill: #1E3A34; }
      .tm { font-size: 12.5px; fill: #3F5A55; }
      .lbl { font-size: 12.5px; font-weight: 700; fill: #B8452A; }
      .panel { fill: #DCEEEA; stroke: #1E3A34; stroke-width: 1.5; }
      .box { fill: #FFFFFF; stroke: #1E3A34; stroke-width: 1.2; }
      .agent { fill: #FBE8E1; stroke: #B8452A; stroke-width: 1.5; }
      .rule { fill: #FFFFFF; stroke: #B8452A; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .chip { fill: #FFFFFF; stroke: #1E3A34; stroke-width: 1.2; }
      .num { fill: #B8452A; }
      .numt { font-size: 14px; font-weight: 700; fill: #FFFFFF; }
      .line { stroke: #1E3A34; stroke-width: 1.6; fill: none; }
    </style>
  </defs>

  <rect width="1600" height="1240" fill="#F4FAF8"/>

  <text x="40" y="52" class="h1">HeyGilli, end to end</text>
  <text x="40" y="78" class="sub">What runs where, and the path from a parent's answers to a child's question and back to the parent.</text>

  <!-- ============ Clients ============ -->
  <rect x="40" y="100" width="500" height="190" rx="14" class="panel"/>
  <text x="60" y="130" class="ph">Parent app</text>
  <text x="60" y="150" class="ps">Flutter: web (heygilli.com/app), iOS, Android</text>
  <text x="60" y="180" class="t">• Setup questionnaire: what they may watch, what they like, breaks</text>
  <text x="60" y="203" class="t">• Review: Shown / Hidden, verdicts as tags, reason one tap away</text>
  <text x="60" y="226" class="t">• Check a video or channel before allowing it (3 a day)</text>
  <text x="60" y="249" class="t">• Ask about a video · digest and progress · limits, breaks, PIN</text>
  <text x="60" y="272" class="t">• Sign in with Google, or set up with no account</text>

  <rect x="560" y="100" width="500" height="190" rx="14" class="panel"/>
  <text x="580" y="130" class="ph">Kid mode</text>
  <text x="580" y="150" class="ps">same Flutter app, landscape, parent PIN to leave</text>
  <text x="580" y="180" class="t">• Official YouTube IFrame embed: ads untouched, no overlays</text>
  <text x="580" y="203" class="t">• Gilli asks by voice at a natural break, 2–3 a video</text>
  <text x="580" y="226" class="t">• Speech becomes text on the device; no audio leaves it</text>
  <text x="580" y="249" class="t">• Shelf like YouTube Kids; search by voice, approved videos only</text>
  <text x="580" y="272" class="t">• Break screen with the activity the parent chose</text>

  <rect x="1080" y="100" width="480" height="190" rx="14" class="panel"/>
  <text x="1100" y="130" class="ph">heygilli.com</text>
  <text x="1100" y="150" class="ps">Cloudflare Pages</text>
  <text x="1100" y="180" class="t">• /  /try  /faq: static pages, readable without JS</text>
  <text x="1100" y="203" class="t">• /try: the screening demo, no login</text>
  <text x="1100" y="226" class="t">• /app/: the Flutter web build of the parent app</text>
  <text x="1100" y="249" class="t">• llms.txt, sitemap, FAQ structured data</text>
  <text x="1100" y="272" class="t">  (checked against the page on every deploy)</text>

  <path d="M 290 290 L 290 346" class="line" marker-end="url(#a)"/>
  <text x="300" y="324" class="lbl">HTTPS REST</text>
  <path d="M 810 290 L 810 346" class="line" marker-end="url(#a)"/>
  <text x="820" y="324" class="lbl">WebSocket, one per session</text>

  <!-- ============ Gateway ============ -->
  <rect x="40" y="350" width="1520" height="200" rx="14" class="panel"/>
  <text x="60" y="380" class="ph">FastAPI gateway</text>
  <text x="222" y="380" class="ps">Python 3.12 on Render · the only thing the apps talk to</text>

  <rect x="60" y="395" width="440" height="140" rx="10" class="box"/>
  <text x="75" y="418" class="bt">REST</text>
  <text x="75" y="440" class="tm">/auth: dev token, or Google sign-in code exchange</text>
  <text x="75" y="460" class="tm">/kids · /policy · /preferences · /channels</text>
  <text x="75" y="480" class="tm">/review · /check (3 a day) · /videos/{id}/ask</text>
  <text x="75" y="500" class="tm">/home · /digest · /progress · /limits · /breaks</text>
  <text x="75" y="520" class="tm">/tts/{hash}.mp3: Gilli's lines, cached</text>

  <rect x="515" y="395" width="330" height="140" rx="10" class="box"/>
  <text x="530" y="418" class="bt">Session loop</text>
  <text x="530" y="440" class="tm">/sessions/{id}/ws</text>
  <text x="530" y="460" class="tm">play → pause at the planned second</text>
  <text x="530" y="480" class="tm">→ ask → listen → answer → reply</text>
  <text x="530" y="500" class="tm">→ resume · break when time is up</text>
  <text x="530" y="520" class="tm">Buddy stays warm all session</text>

  <rect x="860" y="395" width="330" height="140" rx="10" class="box"/>
  <text x="875" y="418" class="bt">Background work</text>
  <text x="875" y="440" class="tm">screening runs when a parent acts:</text>
  <text x="875" y="460" class="tm">adds a channel, finishes setup,</text>
  <text x="875" y="480" class="tm">taps "Check for new videos"</text>
  <text x="875" y="500" class="tm">questions planned on approval,</text>
  <text x="875" y="520" class="tm">or on first play if missing</text>

  <rect x="1205" y="395" width="335" height="140" rx="10" class="rule"/>
  <text x="1220" y="418" class="bt">Enforced in code, not asked</text>
  <text x="1220" y="440" class="tm">safety prescreen (live, too long, …)</text>
  <text x="1220" y="460" class="tm">length ceiling · daily limit · breaks</text>
  <text x="1220" y="480" class="tm">band timing and question rules</text>
  <text x="1220" y="500" class="tm">a preference never hides a video</text>
  <text x="1220" y="520" class="tm">nothing reaches a child unapproved</text>

  <path d="M 540 550 L 540 586" class="line" marker-end="url(#a)"/>
  <text x="550" y="574" class="lbl">judgement calls</text>
  <path d="M 1310 550 L 1310 586" class="line" marker-end="url(#a)"/>
  <text x="1320" y="574" class="lbl">fetching</text>

  <!-- ============ Agents ============ -->
  <rect x="40" y="590" width="1000" height="260" rx="14" class="panel"/>
  <text x="60" y="620" class="ph">Strands Agents SDK</text>
  <text x="262" y="620" class="ps">eight agents · the agents decide, the code fetches and enforces</text>

  <rect x="60" y="640" width="230" height="80" rx="10" class="agent"/>
  <text x="75" y="664" class="bt">Curator</text>
  <text x="75" y="686" class="tm">screens each new upload</text>
  <text x="75" y="706" class="tm">approve · hide · ask the parent</text>

  <rect x="302" y="640" width="230" height="80" rx="10" class="agent"/>
  <text x="317" y="664" class="bt">Planner</text>
  <text x="317" y="686" class="tm">2–3 questions a video</text>
  <text x="317" y="706" class="tm">per age band and language</text>

  <rect x="544" y="640" width="230" height="80" rx="10" class="agent"/>
  <text x="559" y="664" class="bt">Buddy</text>
  <text x="559" y="686" class="tm">live, one per session</text>
  <text x="559" y="706" class="tm">scores, replies, adapts</text>

  <rect x="786" y="640" width="234" height="80" rx="10" class="agent"/>
  <text x="801" y="664" class="bt">Digest</text>
  <text x="801" y="686" class="tm">the parent's daily digest</text>
  <text x="801" y="706" class="tm">progress note, history summary</text>

  <rect x="60" y="732" width="230" height="80" rx="10" class="agent"/>
  <text x="75" y="756" class="bt">Reviewer</text>
  <text x="75" y="778" class="tm">what a channel publishes</text>
  <text x="75" y="798" class="tm">and when it starts to drift</text>

  <rect x="302" y="732" width="230" height="80" rx="10" class="agent"/>
  <text x="317" y="756" class="bt">Coach</text>
  <text x="317" y="778" class="tm">drafts for the parent only:</text>
  <text x="317" y="798" class="tm">household questions, break lines</text>

  <rect x="544" y="732" width="230" height="80" rx="10" class="agent"/>
  <text x="559" y="756" class="bt">Explainer</text>
  <text x="559" y="778" class="tm">answers a parent's question</text>
  <text x="559" y="798" class="tm">from the transcript (@tool)</text>

  <rect x="786" y="732" width="234" height="80" rx="10" class="agent"/>
  <text x="801" y="756" class="bt">Playmate</text>
  <text x="801" y="778" class="tm">runs Gilli's six games:</text>
  <text x="801" y="798" class="tm">how hard the next round is</text>

  <text x="60" y="838" class="tm">Every agent: frozen prompt, Pydantic output, safe fallback, own model via HEYGILLI_MODEL_&lt;ROLE&gt;=&lt;provider&gt;:&lt;model id&gt;.</text>

  <!-- ============ Fetchers ============ -->
  <rect x="1060" y="590" width="500" height="260" rx="14" class="panel"/>
  <text x="1080" y="620" class="ph">Plain Python functions</text>
  <text x="1080" y="640" class="ps">called by the gateway, never handed to a model</text>

  <rect x="1080" y="655" width="460" height="40" rx="8" class="box"/>
  <text x="1095" y="680" class="t">YouTube RSS + oEmbed: new uploads, no API quota</text>
  <rect x="1080" y="703" width="460" height="40" rx="8" class="box"/>
  <text x="1095" y="728" class="t">YouTube Data API: video lengths, parent's channel search</text>
  <rect x="1080" y="751" width="460" height="40" rx="8" class="box"/>
  <text x="1095" y="776" class="t">Transcripts: public captions (proxy) → Gemini → title only</text>
  <rect x="1080" y="799" width="460" height="40" rx="8" class="box"/>
  <text x="1095" y="824" class="t">Kid-safe icon library (shared/icons.json) · Polly speech</text>

  <path d="M 300 850 L 300 896" class="line" marker-end="url(#a)"/>
  <text x="310" y="880" class="lbl">model calls</text>
  <path d="M 600 850 L 600 896" class="line" marker-end="url(#a)"/>
  <text x="610" y="880" class="lbl">Gilli's voice</text>
  <path d="M 880 850 L 880 896" class="line" marker-end="url(#a)"/>
  <text x="890" y="880" class="lbl">all state</text>
  <path d="M 1310 850 L 1310 896" class="line" marker-end="url(#a)"/>
  <text x="1320" y="880" class="lbl">video, feeds, transcripts</text>

  <!-- ============ Cloud services ============ -->
  <rect x="40" y="900" width="1000" height="150" rx="14" class="panel"/>
  <text x="60" y="928" class="ph">AWS</text>
  <rect x="60" y="945" width="400" height="90" rx="10" class="box"/>
  <text x="75" y="968" class="bt">Amazon Bedrock</text>
  <text x="75" y="990" class="tm">Amazon Nova Pro by default (us-east-1)</text>
  <text x="75" y="1010" class="tm">Claude on Bedrock once account access is granted</text>
  <rect x="475" y="945" width="250" height="90" rx="10" class="box"/>
  <text x="490" y="968" class="bt">Amazon Polly</text>
  <text x="490" y="990" class="tm">Gilli's voice, English and Urdu</text>
  <text x="490" y="1010" class="tm">cached per line</text>
  <rect x="740" y="945" width="280" height="90" rx="10" class="box"/>
  <text x="755" y="968" class="bt">Amazon DynamoDB</text>
  <text x="755" y="990" class="tm">one table, key = household</text>
  <text x="755" y="1010" class="tm">no child PII, no audio kept</text>

  <rect x="1060" y="900" width="500" height="150" rx="14" class="panel"/>
  <text x="1080" y="928" class="ph">Google</text>
  <rect x="1080" y="945" width="145" height="90" rx="10" class="box"/>
  <text x="1092" y="968" class="bt">YouTube</text>
  <text x="1092" y="990" class="tm">IFrame player</text>
  <text x="1092" y="1010" class="tm">RSS, Data API</text>
  <rect x="1237" y="945" width="145" height="90" rx="10" class="box"/>
  <text x="1249" y="968" class="bt">Gemini API</text>
  <text x="1249" y="990" class="tm">reads a video URL</text>
  <text x="1249" y="1010" class="tm">for its transcript</text>
  <rect x="1394" y="945" width="146" height="90" rx="10" class="box"/>
  <text x="1406" y="968" class="bt">Sign-In</text>
  <text x="1406" y="990" class="tm">optional for</text>
  <text x="1406" y="1010" class="tm">parents</text>

  <!-- ============ One video, end to end ============ -->
  <text x="40" y="1096" class="ph">One video, end to end</text>

  <g>
    <rect x="40" y="1110" width="290" height="46" rx="23" class="chip"/>
    <circle cx="64" cy="1133" r="14" class="num"/><text x="59.5" y="1138" class="numt">1</text>
    <text x="88" y="1138" class="t">Parent answers a few questions</text>

    <rect x="348" y="1110" width="290" height="46" rx="23" class="chip"/>
    <circle cx="372" cy="1133" r="14" class="num"/><text x="367.5" y="1138" class="numt">2</text>
    <text x="396" y="1138" class="t">Curator reads each new upload</text>

    <rect x="656" y="1110" width="290" height="46" rx="23" class="chip"/>
    <circle cx="680" cy="1133" r="14" class="num"/><text x="675.5" y="1138" class="numt">3</text>
    <text x="704" y="1138" class="t">Planner writes 2–3 questions</text>

    <rect x="964" y="1110" width="290" height="46" rx="23" class="chip"/>
    <circle cx="988" cy="1133" r="14" class="num"/><text x="983.5" y="1138" class="numt">4</text>
    <text x="1012" y="1138" class="t">Parent sees verdicts, allows</text>

    <rect x="1272" y="1110" width="288" height="46" rx="23" class="chip"/>
    <circle cx="1296" cy="1133" r="14" class="num"/><text x="1291.5" y="1138" class="numt">5</text>
    <text x="1320" y="1138" class="t">Child presses play</text>

    <rect x="194" y="1170" width="290" height="46" rx="23" class="chip"/>
    <circle cx="218" cy="1193" r="14" class="num"/><text x="213.5" y="1198" class="numt">6</text>
    <text x="242" y="1198" class="t">Video pauses; Gilli asks aloud</text>

    <rect x="502" y="1170" width="290" height="46" rx="23" class="chip"/>
    <circle cx="526" cy="1193" r="14" class="num"/><text x="521.5" y="1198" class="numt">7</text>
    <text x="550" y="1198" class="t">Child answers by voice or tap</text>

    <rect x="810" y="1170" width="290" height="46" rx="23" class="chip"/>
    <circle cx="834" cy="1193" r="14" class="num"/><text x="829.5" y="1198" class="numt">8</text>
    <text x="858" y="1198" class="t">Buddy replies; video resumes</text>

    <rect x="1118" y="1170" width="290" height="46" rx="23" class="chip"/>
    <circle cx="1142" cy="1193" r="14" class="num"/><text x="1137.5" y="1198" class="numt">9</text>
    <text x="1166" y="1198" class="t">Digest tells the parent</text>
  </g>
</svg>
