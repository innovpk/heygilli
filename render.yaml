services:
  - type: web
    name: heygilli-gateway
    runtime: python
    plan: free
    rootDir: agents
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn heygilli_agents.gateway:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      # Nova Pro is the floor: it carries Curator and Reviewer, which between
      # them eat almost every input token (transcripts, and one RSS feed per
      # imported channel). Their call is coarse — approve/hide/ask, and what a
      # channel publishes — so the cheap model is the right one.
      - key: HEYGILLI_MODEL_DEFAULT
        value: bedrock:us.amazon.nova-pro-v1:0
      # The two roles a parent actually reads run on Sonnet. The Planner writes
      # the questions a child meets; the Digest writes the note at the end of
      # the day. Digest is nearly free either way — counts and answers, no
      # transcript. Planner is not, but plans cache per (video, band, language),
      # so the bill follows unique videos rather than sessions.
      - key: HEYGILLI_MODEL_PLANNER
        value: bedrock:us.anthropic.claude-sonnet-4-6
      - key: HEYGILLI_MODEL_DIGEST
        value: bedrock:us.anthropic.claude-sonnet-4-6
      - key: HEYGILLI_CAPTION_INTERVAL_S
        value: "1.5"
      - key: AWS_REGION
        value: us-east-1
      # Render's free disk is wiped on every deploy and every wake from sleep,
      # so the default local JSON store would lose every household. DynamoDB
      # table self-provisions on first boot (store.get_store).
      - key: HEYGILLI_STORE
        value: dynamo
      - key: HEYGILLI_DYNAMO_TABLE
        value: heygilli
      # Token-signing key: Render generates it. The code default is
      # "dev-secret-change-me", which would let anyone forge a household token.
      - key: HEYGILLI_SECRET
        generateValue: true
      # Prompted at blueprint creation, never stored in git.
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET are set in the Render dashboard
      # after the service exists. Without them the gateway still boots and
      # /auth/dev works; /auth/google returns 503 and subscription import is off.
      #
      # Transcripts. YouTube refuses caption requests from this address — it is
      # a datacenter — so the Curator has nothing to screen on unless one of
      # these is set (tools/transcript.py explains the order).
      #   GOOGLE_API_KEY          an AI Studio key; free tier, tried first
      #   HEYGILLI_PROXY_URL      http://user:pass@host:port, used once Gemini's
      #                           quota is gone. Or WEBSHARE_PROXY_USERNAME and
      #                           WEBSHARE_PROXY_PASSWORD for a Webshare pool.
      # Both are set in the dashboard, never in git. With neither, the gateway
      # still boots and every other screen works; only new-upload screening is
      # off, and it says so rather than approving unread videos.
      - key: GOOGLE_API_KEY
        sync: false
      # Searching YouTube for a channel needs a *plain* API key, not the AI
      # Studio one above: that is bound to a service account, and the YouTube
      # Data API refuses that shape outright — "API keys are not supported by
      # this API" — however its restrictions are set. Create one under
      # Credentials, restrict it to YouTube Data API v3, and set it here.
      # Without it the app still works; parent search says it is not set up.
      - key: HEYGILLI_YOUTUBE_API_KEY
        sync: false
